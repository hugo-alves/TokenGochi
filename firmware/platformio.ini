; PlatformIO project config for the M5Stack StopWatch Dev Kit (C152, ESP32-S3).
; Pin map, libraries, and partition table follow the M5Stack quickstart
; (https://docs.m5stack.com/en/arduino/stopwatch/program).
;
; Quick commands:
;   ../tools/pio run                    ; build
;   ../tools/pio run -t upload          ; build + flash
;   ../tools/pio device monitor         ; open serial console (115200)
;   ../tools/pio run -t uploadfs        ; flash the LittleFS data partition (if used)

[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform        = espressif32 @ 6.12.0
board           = esp32s3box
framework       = arduino

board_build.partitions        = default_16MB.csv
board_upload.flash_size       = 16MB
board_upload.maximum_size     = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed                 = 115200

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; -DCORE_DEBUG_LEVEL=5     ; uncomment for verbose ESP logs

lib_deps =
    M5Unified  = https://github.com/m5stack/M5Unified
    M5GFX      = https://github.com/m5stack/M5GFX
    M5PM1      = https://github.com/m5stack/M5PM1
    M5IOE1     = https://github.com/m5stack/M5IOE1
    bblanchon/ArduinoJson @ ^7.0.0

[env:native]
platform        = native
test_framework  = unity
test_build_src  = yes
build_src_filter =
    -<*>
    +<device_settings.cpp>
    +<battery_status.cpp>
    +<display_policy.cpp>
